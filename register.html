<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Join FitZone Gym</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>🏋 FitZone</h2>
    <div>
        <a href="index.html">Home</a>
        <a href="login.html">Admin Login</a>
    </div>
</nav>

<div class="form-box">

    <p class="small-title center">JOIN FITZONE</p>
    <h2>Member Registration</h2>

    <p class="center">
        Fill in your details to become a FitZone member.
    </p>

    <form action="register.php" method="POST" onsubmit="return validateForm()">

        <label>Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <label>Phone Number</label>
        <input type="text" id="phone" name="phone" placeholder="10 digit phone number">

        <label>Gender</label>
        <select id="gender" name="gender">
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Age</label>
        <input type="number" id="age" name="age" placeholder="Enter age">

        <label>Membership Plan</label>
        <select id="plan" name="plan">
            <option value="">Select Plan</option>
            <option>Basic - ₹1000 / 1 Month</option>
            <option>Standard - ₹2500 / 3 Months</option>
            <option>Premium - ₹4500 / 6 Months</option>
            <option>Annual - ₹8000 / 12 Months</option>
        </select>

        <label>Joining Date</label>
        <input type="date" id="joining_date" name="joining_date">

        <button type="submit">Register as Member</button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
